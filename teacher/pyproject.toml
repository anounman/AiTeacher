[project]
name = "aiteacher-teacher"
version = "0.1.0"
description = "AI Teacher service: knowledge plane (ingest, index, retrieve) + teaching plane (deepagents). See ../ARCHITECTURE_V2.md."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.38",
    "pydantic>=2.12",
    "pydantic-settings>=2.8",
    "httpx>=0.28",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pgvector>=0.4",
    "alembic>=1.14",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
# Parsing is split by whether the job needs page provenance (ARCHITECTURE_V2 §2.5):
# docling for PDF/DOCX/PPTX, markitdown for the long tail.
parse = [
    "docling>=2.0",
    "markitdown[all]>=0.1",
]
agents = [
    "deepagents>=0.2",
    "langchain-ollama>=0.3",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
